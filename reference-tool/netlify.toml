# Deploy the multi-file version.
#
# There is no build step and no dependencies. Netlify (or any static host) can
# serve this folder as-is.
#
#   Netlify CLI :  cd reference-tool && netlify deploy --prod
#   Netlify UI  :  drag this folder onto the deploy area
#   GitHub Pages:  copy this folder to the repo root (or /docs) and enable Pages
#
# The single-file build in ../dist/photo-signature-fitter.html is an alternative:
# it needs no server at all and can be opened from a file share or a USB stick.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # The page makes no network requests at all (verified in _verify/test_single_file.mjs),
    # so everything except its own assets is denied.
    #
    # 'unsafe-inline' for script and style is required only by the SINGLE-FILE build,
    # which inlines both. It is included here so that the same header works whichever
    # build is deployed. If you deploy only the multi-file version, you can tighten
    # script-src to 'self' — the modules are external files.
    #
    # The residual risk is low: nothing in the app writes untrusted input into
    # innerHTML. All user-visible values go through textContent.
    Content-Security-Policy = "default-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; manifest-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
